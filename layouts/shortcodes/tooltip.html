<span class="tooltip-trigger" style="position:relative;cursor:pointer;text-decoration:underline dotted"
  onmouseenter="if(!this.dataset.pinned)this.querySelector('.tip').style.display='block'"
  onmouseleave="if(!this.dataset.pinned)this.querySelector('.tip').style.display='none'"
  onclick="event.stopPropagation();let el=this;let t=el.querySelector('.tip');if(el.dataset.pinned){el.dataset.pinned='';t.style.display='none';}else{el.dataset.pinned='1';t.style.display='block';document.addEventListener('click',function h(){el.dataset.pinned='';t.style.display='none';document.removeEventListener('click',h)})}"
>{{ .Get "label" | safeHTML }}<span class="tip" style="display:none;position:absolute;left:0;top:1.5em;background:#333;color:#fff;padding:4px 8px;border-radius:4px;font-size:0.85em;width:max-content;z-index:10">{{ .Inner | safeHTML }}</span></span>
