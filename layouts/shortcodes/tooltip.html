<span class="tooltip-trigger" style="position:relative;cursor:pointer;text-decoration:underline dotted" onmouseenter="this.querySelector('.tip').style.display='block'" onmouseleave="this.querySelector('.tip').style.display='none'" onclick="event.stopPropagation();let t=this.querySelector('.tip');let show=t.style.display!=='block';t.style.display=show?'block':'none';if(show){document.addEventListener('click',function h(){t.style.display='none';document.removeEventListener('click',h)})}">{{ .Get "label" | safeHTML }}<span class="tip" style="display:none;position:absolute;left:0;top:1.5em;background:#333;color:#fff;padding:4px 8px;border-radius:4px;font-size:0.85em;width:max-content;z-index:10">{{ .Inner | safeHTML }}</span></span>
